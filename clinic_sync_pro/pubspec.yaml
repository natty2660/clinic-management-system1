name: clinic_sync_pro
description: "ClinicSync Pro — Multi-Station Hospital Desktop Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & Realtime Local Mesh
  http: ^1.2.0
  web_socket_channel: ^2.4.1

  # Local Persistence & Utilities
  shared_preferences: ^2.2.2
  intl: ^0.19.0

  # Hardware Interop & Documents
  qr_flutter: ^4.1.0
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true